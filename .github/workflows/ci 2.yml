name: CI

# Validates every push/PR, and deploys to Cloudflare Workers on push to main
# (or on demand via "Run workflow" with deploy=true, e.g. to test-deploy a
# branch before merging).
#
# Required repository secrets for the deploy job:
#   CLOUDFLARE_API_TOKEN   - API token with Workers Scripts:Edit, D1:Edit and
#                            Workers R2 Storage:Edit permissions
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id
#
# First deploy auto-provisions the D1 database and R2 bucket named in
# wrangler.jsonc. After the first deploy, open /_emdash/admin on the new
# worker URL to claim the admin account (setup wizard).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this ref to Cloudflare Workers"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Node target)
        run: npm run build

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Check deploy secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -z "$CF_TOKEN" ] && { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; missing=1; }
          [ -z "$CF_ACCOUNT" ] && { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"; missing=1; }
          exit $missing

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare target)
        run: npm run build:cf

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
